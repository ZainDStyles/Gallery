<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nish Man Barber</title>

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    .intro {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
    }

    .intro video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>

<body>
  <div class="intro">
    <video autoplay muted playsinline preload="auto">
      <source src="videos/shop-intro.mp4" type="video/mp4" />
      <source src="videos/shop-intro.webm" type="video/webm" />
    </video>
  </div>
</body>
</html>
