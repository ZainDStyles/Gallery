name: Fetch salon media

# Runs when the media list changes: downloads the files, shrinks them for the web and commits them
on:
  push:
    branches: [main]
    paths:
      - salon/assets/media.txt
      - .github/fetch-salon-media.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-salon-media
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download and compress
        run: bash .github/fetch-salon-media.sh
      - name: Commit new files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salon/assets
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Add web-sized salon media"
          git pull --rebase origin main
          git push
